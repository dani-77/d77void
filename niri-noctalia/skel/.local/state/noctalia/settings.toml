[bar.default]
end = [ "media", "tray", "notifications", "network", "brightness", "battery", "control-center", "session" ]
margin_ends = 10

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 961.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[nightlight]
enabled = true

[shell.launcher]
session_search = true

[shell.panel]
floating_offset = 6
session_placement = "floating"
session_position = "center"
wallpaper_placement = "floating"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "~/Wallpaper"

    [wallpaper.default]
    path = "~/Wallpaper/noctalia.png"

    [wallpaper.last]
    path = "~/Wallpaper/noctalia.png"

    [wallpaper.monitors.eDP-1]
    path = "~/Wallpaper/noctalia.png"
