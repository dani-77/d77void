[global/wm]
margin-bottom = 0
margin-top = 0
include-file = ./colors.ini
include-file = ./modules.ini
include-file = ./user_modules.ini

[bar/main]
monitor = ${env:monitor}
monitor-fallback =
monitor-strict = false
override-redirect = false
bottom = false
fixed-center = true
width = 100%
height = 38
offset-x = 0%
offset-y = 0%
background = ${color.background}
foreground = ${color.foreground}
radius = 12.0
line-size = 0
line-color = ${color.background}
border-size = 4pt
padding = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "Iosevka Nerd Font:size=9;4"
font-1 = "Blex Mono Nerd Font:size=9;3"
font-2 = "feather:size=9;3"
modules-left = powermenu workspaces 
modules-center = weather date
modules-right = network alsa cpu memory battery
dim-value = 1.0
#tray-position = right
#tray-detached = false
enable-ipc = true

[settings]
throttle-output = 5
throttle-output-for = 10
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = true

