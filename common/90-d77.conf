# d77void: keep the generated initramfs small enough for the GRUB
# payload to load on coreboot/SeaBIOS systems (Libreboot ThinkPads).
# A full generic dracut image (~100+ MB) trips GRUB's 32-bit initrd
# allocation in the tight coreboot memory map; a host-only zstd image
# (~20-30 MB) loads fine.
hostonly="yes"
hostonly_cmdline="no"
compress="zstd"
# Safety net in case host-only probing misses the boot controller
# (both NVMe and SATA/AHCI targets).
force_drivers+=" nvme nvme_core ahci sd_mod "
