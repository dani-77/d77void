---
dontChroot: false
timeout: 10
verbose: false

# /etc/calamares is raw-copied into the ISO at build time (mkd77.sh), never
# an xbps package -- so removing the `calamares` package alone (packages.conf)
# never touches these files. Clean them up here instead.
script:
  - command: rm -rf /etc/calamares
  # bake the [d77void] repo in from the start -- the file it copies still
  # comes from lib-d77-welcome/d77void-repo (unpackfs already put it on
  # disk), only the welcome-app button becomes redundant, not the source.
  - command: cp /usr/lib/lib-d77-welcome/d77void.conf /etc/xbps.d/d77void-repo.conf
